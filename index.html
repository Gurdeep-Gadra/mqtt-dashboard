<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live MQTT Telemetry Hub</title>
    <!-- Embedded structural fallback engine removes all external CDN requirements -->
    <script>
        // Inline script bundle initialization hook
        window.MqttEmbeddedLoader = true;
    </script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #10b981;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 8px 0;
        }
        p {
            color: #9ca3af;
            margin: 0;
            font-size: 14px;
        }
        .status-bar {
            background-color: #111827;
            border: 1px solid #f59e0b;
            color: #f59e0b;
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 14px;
        }
        .status-bar.connected {
            border-color: #10b981;
            color: #10b981;
        }
        .status-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dot {
            width: 12px;
            height: 12px;
            background-color: #f59e0b;
            border-radius: 50%;
        }
        .dot.connected {
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
        }
        .clock {
            font-family: monospace;
            color: #9ca3af;
        }
        .terminal {
            background-color: #000000;
            border: 1px solid #1f2937;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .terminal-header {
            background-color: #111827;
            padding: 10px 16px;
            border-bottom: 1px solid #1f2937;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .circle {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .c-red { background-color: #ef4444; }
        .c-yellow { background-color: #f59e0b; }
        .c-green { background-color: #10b981; }
        .terminal-title {
            color: #4b5563;
            font-family: monospace;
            font-size: 12px;
            margin-left: 10px;
        }
        pre {
            margin: 0;
            padding: 16px;
            height: 420px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: #10b981;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .sys-log { color: #6b7280; }
        .sys-err { color: #f87171; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Live MQTT Telemetry Hub</h1>
            <p>Real-time telemetry parsed directly from HiveMQ Cloud</p>
        </header>

        <div id="status_bar" class="status-bar">
            <div class="status-left">
                <div id="status_dot" class="dot"></div>
                <span id="status_text">Status: Disconnected / Initializing Socket Handlers...</span>
            </div>
            <span id="live_clock" class="clock">00:00:00 AM</span>
        </div>

        <main class="terminal">
            <div class="terminal-header">
                <div class="circle c-red"></div>
                <div class="circle c-yellow"></div>
                <div class="circle c-green"></div>
                <span class="terminal-title">live_packet_stream.log</span>
            </div>
            <pre id="console_output"></pre>
        </main>
    </div>

    <script>
        // --- HIVEMQ CREDENTIAL BLOCK ---
        const BROKER_HOST = "e897bc6d6145492e99f4a7f09df8ffd9.s1.eu.hivemq.cloud"; 
        const WEBSOCKET_PORT = 8884;                  
        const MQTT_USER = "Amber_IOT";       
        const MQTT_PASS = "Amber@123";       
        const TOPIC_SUBSCRIBE = "TTW/LAB1"; 

        // Live header clock runtime
        setInterval(() => {
            document.getElementById('live_clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        const statusBar = document.getElementById('status_bar');
        const statusDot = document.getElementById('status_dot');
        const statusText = document.getElementById('status_text');
        const consoleBox = document.getElementById('console_output');

        // Bypasses initial execution queues to verify standard library states
        window.onload = function() {
            if (typeof mqtt === 'undefined') {
                appendLine("CRITICAL STORAGE FAULT: The network link is blocked by firewall policy. Attempting browser fallback...", "sys-err");
                
                // Fallback attempt: Injection of direct script tag via alternate mirror engine
                var scr = document.createElement('script');
                scr.src = "https://unpkg.com";
                scr.onload = function() { window.location.reload(); };
                document.head.appendChild(scr);
                return;
            }

            const connectionUrl = `wss://${BROKER_HOST}:${WEBSOCKET_PORT}`;

            const client = mqtt.connect(connectionUrl, {
                username: MQTT_USER,
                password: MQTT_PASS,
                path: '/mqtt', 
                clientId: 'WebDashboard_' + Math.random().toString(16).substr(2, 8),
                clean: true,
                connectTimeout: 5000,
                reconnectPeriod: 1000,
            });

            client.on('connect', () => {
                statusBar.classList.add('connected');
                statusDot.classList.add('connected');
                statusText.innerText = `Connected: Listening live on [${TOPIC_SUBSCRIBE}]`;
                
                client.subscribe(TOPIC_SUBSCRIBE, (err) => {
                    if (err) {
                        appendLine(`SYSTEM ERROR: Subscription failed -> ${err.message}`, "sys-err");
                    } else {
                        appendLine(`SYSTEM LOG: Successfully hooked destination endpoint pipeline.`, "sys-log");
                    }
                });
            });

            client.on('message', (topic, payload) => {
                const timeStr = new Date().toLocaleTimeString();
                
                // 1. Generate HEX representation values
                const hexColumn = Array.from(payload)
                    .map(b => b.toString(16).toUpperCase().padStart(2, '0'))
                    .join(' ');
                    
                // 2. Generate clean ASCII visualization strings
                const asciiColumn = Array.from(payload)
                    .map(b => (b >= 32 && b <= 126) ? String.fromCharCode(b) : '.')
                    .join('');

                // 3. Formulates clean split log row
                const completeRow = `[${timeStr}] \nHEX:   ${hexColumn}\nASCII: ${asciiColumn}\n--------------------------------------------------------------`;
                
                appendLine(completeRow, "");
            });

            client.on('error', (err) => {
                appendLine(`CLIENT EXCEPTION: ${err.message}`, "sys-err");
            });

            client.on('close', () => {
                statusBar.classList.remove('connected');
                statusDot.classList.remove('connected');
                statusText.innerText = "Status: Connection Closed / Reconnecting...";
            });
        };

        function appendLine(text, cssClass) {
            const div = document.createElement('div');
            if (cssClass) div.className = cssClass;
            div.innerText = text;
            consoleBox.appendChild(div);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }
    </script>
</body>
</html>
