<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live MQTT Telemetry Hub</title>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 24px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #10b981; font-size: 28px; text-transform: uppercase; letter-spacing: 2px; margin: 0 0 8px 0; }
        p { color: #9ca3af; margin: 0; font-size: 14px; }
        .status-bar { background-color: #111827; border: 1px solid #f59e0b; color: #f59e0b; padding: 12px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-weight: bold; font-size: 14px; }
        .status-bar.connected { border-color: #10b981; color: #10b981; }
        .status-left { display: flex; align-items: center; gap: 10px; }
        .dot { width: 12px; height: 12px; background-color: #f59e0b; border-radius: 50%; }
        .dot.connected { background-color: #10b981; box-shadow: 0 0 8px #10b981; }
        .clock { font-family: monospace; color: #9ca3af; }
        .terminal { background-color: #000000; border: 1px solid #1f2937; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .terminal-header { background-color: #111827; padding: 10px 16px; border-bottom: 1px solid #1f2937; display: flex; align-items: center; gap: 6px; }
        .circle { width: 12px; height: 12px; border-radius: 50%; }
        .c-red { background-color: #ef4444; }
        .c-yellow { background-color: #f59e0b; }
        .c-green { background-color: #10b981; }
        .terminal-title { color: #4b5563; font-family: monospace; font-size: 12px; margin-left: 10px; }
        pre { margin: 0; padding: 16px; height: 420px; overflow-y: auto; font-family: 'Courier New', Courier, monospace; font-size: 13px; color: #10b981; line-height: 1.6; white-space: pre-wrap; }
        .sys-log { color: #6b7280; }
        .sys-err { color: #f87171; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Live MQTT Telemetry Hub</h1>
            <p>Real-time telemetry parsed directly from HiveMQ Cloud</p>
        </header>

        <div id="status_bar" class="status-bar">
            <div class="status-left">
                <div id="status_dot" class="dot"></div>
                <span id="status_text">Status: Building secure broker tunnel...</span>
            </div>
            <span id="live_clock" class="clock">00:00:00 AM</span>
        </div>

        <main class="terminal">
            <div class="terminal-header">
                <div class="circle c-red"></div>
                <div class="circle c-yellow"></div>
                <div class="circle c-green"></div>
                <span class="terminal-title">live_packet_stream.log</span>
            </div>
            <pre id="console_output"></pre>
        </main>
    </div>

    <script>
        // --- HIVEMQ SECURITY TARGETS ---
        const BROKER_HOST = "e897bc6d6145492e99f4a7f09df8ffd9.s1.eu.hivemq.cloud"; 
        const WEBSOCKET_PORT = 8884;                  
        const MQTT_USER = "Amber_IOT";       
        const MQTT_PASS = "Amber@123";       
        const TOPIC_SUBSCRIBE = "TTW/LAB1"; 

        // Visual Ticker
        setInterval(() => {
            document.getElementById('live_clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        const statusBar = document.getElementById('status_bar');
        const statusDot = document.getElementById('status_dot');
        const statusText = document.getElementById('status_text');

        let ws;
        let pingTimer;

        function connectNativeMQTT() {
            const url = `wss://${BROKER_HOST}:${WEBSOCKET_PORT}/mqtt`;
            ws = new WebSocket(url, ["mqtt"]); // Enforce sub-protocol authentication mapping
            ws.binaryType = "arraybuffer";

            ws.onopen = () => {
                // Compile micro-binary buffer to send security identification tokens
                sendMqttConnectPacket();
            };

            ws.onmessage = (event) => {
                const payload = new Uint8Array(event.data);
                if (payload.length === 0) return;

                const packetType = payload[0] >> 4;

                // 2 = CONNACK packet (Server authorized the username/password successfully!)
                if (packetType === 2) {
                    statusBar.classList.add('connected');
                    statusDot.classList.add('connected');
                    statusText.innerText = `Connected: Listening live on [${TOPIC_SUBSCRIBE}]`;
                    appendLine("SYSTEM LOG: Authorization approved! Subscribing to data stream...", "sys-log");
                    sendMqttSubscribePacket();
                    
                    // Send an automated heartbeat keepalive ping packet every 30 seconds
                    clearInterval(pingTimer);
                    pingTimer = setInterval(() => { if(ws.readyState === 1) ws.send(new Uint8Array([192, 0])); }, 30000);
                }
                
                // 3 = PUBLISH packet (This contains the live telemetry data from your ESP32!)
                if (packetType === 3) {
                    // Extract payload data by skipping the variable MQTT control headers
                    const varHeaderStart = 2;
                    const topicLen = (payload[varHeaderStart] << 8) + payload[varHeaderStart + 1];
                    const dataIndex = varHeaderStart + 2 + topicLen;
                    const rawDataBytes = payload.subarray(dataIndex);

                    if (rawDataBytes.length === 0) return;

                    const timeStr = new Date().toLocaleTimeString();
                    
                    // Format into parallel data structures
                    const hexColumn = Array.from(rawDataBytes).map(b => b.toString(16).toUpperCase().padStart(2, '0')).join(' ');
                    const asciiColumn = Array.from(rawDataBytes).map(b => (b >= 32 && b <= 126) ? String.fromCharCode(b) : '.').join('');

                    appendLine(`[${timeStr}] \nHEX:   ${hexColumn}\nASCII: ${asciiColumn}\n--------------------------------------------------------------`, "");
                }
            };

            ws.onclose = () => {
                clearInterval(pingTimer);
                statusBar.classList.remove('connected');
                statusDot.classList.remove('connected');
                statusText.innerText = "Status: Reconnecting to HiveMQ Broker...";
                setTimeout(connectNativeMQTT, 4000);
            };
        }

        // Binary builders generating standard lightweight MQTT protocol frames without dependencies
        function sendMqttConnectPacket() {
            const cid = "WebHub" + Math.floor(Math.random() * 1000);
            const enc = new TextEncoder();
            const bUser = enc.encode(MQTT_USER);
            const bPass = enc.encode(MQTT_PASS);
            const bCid = enc.encode(cid);

            const remLen = 12 + (2 + bCid.length) + (2 + bUser.length) + (2 + bPass.length);
            const pkt = new Uint8Array(2 + remLen);
            
            let idx = 0;
            pkt[idx++] = 16; // CONNECT Control Code
            pkt[idx++] = remLen;
            pkt[idx++] = 0; pkt[idx++] = 4; // Protocol name length
            pkt[idx++] = 116; pkt[idx++] = 81; pkt[idx++] = 116; pkt[idx++] = 116; // "MQTT"
            pkt[idx++] = 4;  // Protocol Level
            pkt[idx++] = 194; // Connect Flags (Username + Password active)
            pkt[idx++] = 0; pkt[idx++] = 60; // Keep alive timer (60s)
            
            // Inject Client ID
            pkt[idx++] = (bCid.length >> 8); pkt[idx++] = (bCid.length & 255);
            pkt.set(bCid, idx); idx += bCid.length;
            
            // Inject Username
            pkt[idx++] = (bUser.length >> 8); pkt[idx++] = (bUser.length & 255);
            pkt.set(bUser, idx); idx += bUser.length;
            
            // Inject Password
            pkt[idx++] = (bPass.length >> 8); pkt[idx++] = (bPass.length & 255);
            pkt.set(bPass, idx); idx += bPass.length;

            ws.send(pkt);
        }

        function sendMqttSubscribePacket() {
            const enc = new TextEncoder();
            const bTopic = enc.encode(TOPIC_SUBSCRIBE);
            const remLen = 2 + 2 + bTopic.length + 1;
            const pkt = new Uint8Array(2 + remLen);
            
            let idx = 0;
            pkt[idx++] = 130; // SUBSCRIBE Control Code
            pkt[idx++] = remLen;
            pkt[idx++] = 0; pkt[idx++] = 1; // Packet Identifier
            pkt[idx++] = (bTopic.length >> 8); pkt[idx++] = (bTopic.length & 255);
            pkt.set(bTopic, idx); idx += bTopic.length;
            pkt[idx++] = 0; // Requested QoS 0

            ws.send(pkt);
        }

        function appendLine(text, cssClass) {
            const consoleBox = document.getElementById('console_output');
            const div = document.createElement('div');
            if (cssClass) div.className = cssClass;
            div.innerText = text;
            consoleBox.appendChild(div);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        window.onload = connectNativeMQTT;
    </script>
</body>
</html>
